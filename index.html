<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隅见 Y1 · 完整长海报</title>
<style>
:root{color-scheme:light;--paper:#f4f2eb;--ink:#253c35;--green:#527664;--line:#a3b1a2}*{box-sizing:border-box}
body{margin:0;background:#e9e8e2;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:0 18px 40px}
button,input{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}
/* 三段各自的控件与状态隐藏，由顶部统一驱动 */
#brand-banner .controls,#robot-triptych .controls,#tech-triptych .controls,#brand-banner .status,#robot-triptych .status,#tech-triptych .status{display:none!important}
/* 三段无缝拼成一张长海报 */
.poster{margin-top:18px;border-radius:12px;overflow:hidden;box-shadow:0 10px 36px #253c3514}
.poster .art{border-radius:0!important;box-shadow:none!important}
.poster .seam{height:1px;background:var(--line);opacity:.35}
.bar{position:sticky;top:0;z-index:5;background:#e9e8e2ee;backdrop-filter:blur(6px);padding:14px 0 10px;border-bottom:1px solid #a3b1a255}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.head h1{font-size:19px;font-weight:500;margin:0;letter-spacing:1px}.head span{font-size:12px;letter-spacing:2px;color:var(--green)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl button,.chapters button{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:7px 15px}
.ctl button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.ctl input{flex:1;min-width:120px;accent-color:var(--green)}
.clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--green);min-width:56px;text-align:right}
.chapters{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.chapters button{font-size:12px;padding:5px 12px}
.live{font-size:12px;color:var(--green);margin-top:8px;min-height:18px;display:flex;gap:18px;flex-wrap:wrap}.live b{font-weight:500;color:var(--ink);margin-right:6px}
.note{font-size:12px;color:var(--green);margin-top:18px;line-height:1.8}
@media(max-width:560px){main{padding:0 12px 32px}.ctl button{padding:7px 11px}.head h1{font-size:16px}.poster .seam{display:none}}
</style>
</head><body><main>
<div class="bar">
<div class="head"><h1>隅见 Y1 · 品牌 / 产品 / 技术</h1><span>BRAND × HOME × TECH</span></div>
<div class="ctl"><button type="button" id="lp-play">播放</button><button type="button" id="lp-still" aria-pressed="true">定格</button><button type="button" id="lp-restart">从头播放</button><input id="lp-time" type="range" min="0" max="44" step="0.05" value="0" aria-label="三段共用动画进度"><span class="clock" id="lp-clock">定格</span></div>
<div class="chapters" role="group" aria-label="跳到章节"><button type="button" data-t="6">01 越过日常</button><button type="button" data-t="23">02 抵达角落</button><button type="button" data-t="41">03 洁净如初</button></div>
<div class="live" aria-live="polite"><span><b>俯视</b><i id="lp-s1">—</i></span><span><b>平视</b><i id="lp-s2">—</i></span></div>
</div>
<div class="poster" data-synced>

<div id="brand-banner">
<style>
#brand-banner{--paper:light-dark(#f4f2eb,#222824);--ink:light-dark(#253c35,#e1e9df);--soft:light-dark(#dadfd4,#3c4940);--faint:light-dark(#e8e9e0,#303a33);--green:light-dark(#527664,#a5c9a8);--body:light-dark(#fffefa,#dce2da);--line:light-dark(#a3b1a2,#687c6d);font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
#brand-banner .art{border-radius:12px;box-shadow:0 8px 28px #253c350a;background:var(--paper);width:100%;display:block}#brand-banner .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0}#brand-banner button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:8px 16px}#brand-banner button[aria-pressed=true]{background:var(--ink);color:var(--paper)}#brand-banner .status{color:var(--green);font-size:13px;min-height:24px;margin:4px 0 8px}#brand-banner input{flex:1;min-width:100px;accent-color:var(--green)}#brand-banner svg text{fill:var(--ink)}#brand-banner svg .minor{fill:var(--green)}#brand-banner .toc{cursor:pointer}#brand-banner .toc:focus-visible{outline:none}#brand-banner .toc:focus-visible rect{stroke:var(--green)}
@media(max-width:560px){#brand-banner .controls{gap:6px}#brand-banner button{padding:8px 11px}}
</style>
<div class="controls"><button type="button" id="bb-play">播放</button><button type="button" id="bb-still" aria-pressed="true">定格</button><button type="button" id="bb-restart">从头播放</button><input id="bb-time" type="range" min="0" max="44" step="0.05" value="0" aria-label="动画进度"></div>
<div class="status" id="bb-status" aria-live="polite">定格 · 隅见 Y1</div>
<svg class="art" id="bb-art" viewBox="0 0 1080 400" role="img" aria-label="品牌横幅：左上为虚构品牌隅见 Y1 的名称、标语、简介和三段目录；右侧为贴地仰视的巨大扫地机器人（已缩为长横幅），右缘略出画，底部吸口吸入细流线和灰尘颗粒">
<defs>
<linearGradient id="bb-cyl" x1="500" x2="1140" gradientUnits="userSpaceOnUse"><stop stop-color="var(--soft)"/><stop offset=".12" stop-color="var(--body)"/><stop offset=".42" stop-color="var(--body)"/><stop offset=".8" stop-color="var(--faint)"/><stop offset="1" stop-color="var(--soft)"/></linearGradient>
<linearGradient id="bb-turret" x1="0" x2="1"><stop stop-color="var(--soft)"/><stop offset=".3" stop-color="var(--body)"/><stop offset=".7" stop-color="var(--faint)"/><stop offset="1" stop-color="var(--soft)"/></linearGradient>
<linearGradient id="bb-shade" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="var(--ink)" stop-opacity="0"/><stop offset="1" stop-color="var(--ink)" stop-opacity=".1"/></linearGradient>
<linearGradient id="bb-win" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--ink)" stop-opacity=".9"/><stop offset="1" stop-color="var(--ink)" stop-opacity=".7"/></linearGradient>
<linearGradient id="bb-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--paper)" stop-opacity="0"/><stop offset="1" stop-color="var(--paper)" stop-opacity=".0"/></linearGradient>
</defs>

<!-- 地面与视平线（沿用技术组的视平线语言：机位从 18 cm 再压到 2 cm） -->
<g transform="translate(0 -190)"><g id="bb-floor"></g>
<line x1="0" y1="532" x2="1080" y2="532" stroke="var(--line)" stroke-dasharray="2 6" opacity=".7"/></g>


<!-- 文字区 -->
<text x="64" y="50" font-size="12" letter-spacing="3">BRAND / YUJIAN Y1</text>
<text x="62" y="144" font-size="62" font-weight="600" letter-spacing="5">隅见</text>
<circle cx="214" cy="138" r="5" fill="var(--green)"/>
<text x="64" y="314" font-size="20" font-weight="500" letter-spacing="3">每个角落，都被看见。</text>
<g id="bb-toc"></g>

<!-- 吸入气流（在机身之前绘制，汇入底部吸口） -->
<g transform="translate(0 -190)"><g id="bb-shadow"><ellipse cx="820" cy="539" rx="372" ry="10" fill="var(--ink)" opacity=".1"/></g>
<g id="bb-under"></g>
<g id="bb-flow"></g>
<g id="bb-body"></g>
<g id="bb-front"></g></g>


<text x="820" y="392" text-anchor="middle" font-size="10" letter-spacing="1" class="minor" style="paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round">视平线 · 机位离地 2 cm*</text>
</svg>
<script>
(()=>{const root=document.getElementById('brand-banner'),q=s=>root.querySelector(s),art=q('#bb-art');let t=0,playing=false,still=true,last=0;
const clamp=v=>Math.max(0,Math.min(1,v)),F=n=>+n.toFixed(2);
/* 机身几何：贴地仰视。顶沿与底沿都在视平线上方，因此看到的是两条向上拱的近侧弧，底面露出一条窄边 */
const CX=820,RR=320,YT=318,RYT=30,YB=498,RYB=16,HZ=532;
const ryAt=y=>RYB+(RYT-RYB)*(YB-y)/(YB-YT);
const nearY=(x,yc,ry)=>yc-ry*Math.sqrt(Math.max(0,1-((x-CX)/RR)**2));
const farY=(x,yc,ry)=>yc+ry*Math.sqrt(Math.max(0,1-((x-CX)/RR)**2));
const arc=(x0,x1,y,far)=>{let p=[];for(let x=x0;x<=x1+.1;x+=8){let r=ryAt(y);p.push(F(Math.min(x,x1))+' '+F(far?farY(Math.min(x,x1),y,r):nearY(Math.min(x,x1),y,r)))}return p};
/* 地面线 */
(function(){let g='';[537,543,551,562,577,597].forEach((y,i)=>g+=`<line x1="0" x2="1080" y1="${y}" y2="${y}" stroke="var(--soft)" stroke-width="1.4" opacity="${F(.95-i*.08)}"/>`);for(let k=-6;k<=6;k++)g+=`<line x1="${820+k*20}" y1="${HZ}" x2="${820+k*260}" y2="600" stroke="var(--soft)" opacity=".55"/>`;q('#bb-floor').innerHTML=g})();
/* 底面（窄边）与固定部件 */
(function(){let u=`<path d="M500 ${YB}A${RR} ${RYB} 0 0 0 1140 ${YB}A${RR} ${RYB} 0 0 0 500 ${YB}Z" fill="var(--ink)" opacity=".78"/>`;
u+=`<rect x="676" y="500" width="38" height="36" rx="15" fill="var(--ink)" opacity=".85"/><rect x="942" y="500" width="38" height="36" rx="15" fill="var(--ink)" opacity=".85"/>`;
u+=`<circle cx="548" cy="501" r="4" fill="var(--line)"/><circle cx="1086" cy="503" r="4" fill="var(--line)"/>`;u+=`<rect x="900" y="503" width="200" height="9" rx="4" fill="var(--green)" opacity=".55"/>`;
u+=`<rect x="742" y="502" width="138" height="11" rx="5.5" fill="var(--ink)"/><g id="bb-roller"></g>`;
q('#bb-under').innerHTML=u;
/* 机身侧面：上沿为顶沿近侧弧，下沿为底沿近侧弧 */
let top=arc(500,1140,YT),bot=arc(500,1140,YB).reverse();
let b=`<path d="M738 ${YT-60}A82 9 0 0 1 902 ${YT-60}V${YT}H738Z" fill="url(#bb-turret)" stroke="var(--line)"/><path d="M738 ${YT-60}A82 9 0 0 1 902 ${YT-60}" fill="none" stroke="var(--body)" stroke-width="2"/>`;
b+=`<path d="M739 ${YT-50}A81 8.8 0 0 1 901 ${YT-50}V${YT-40}A81 8.8 0 0 0 739 ${YT-40}Z" fill="var(--ink)" opacity=".78"/><path d="M748 ${YT-46}A72 7.6 0 0 1 892 ${YT-46}" fill="none" stroke="var(--body)" opacity=".3"/><circle id="bb-tled" cx="852" cy="${YT-36}" r="2.6" fill="var(--green)"/>`;
b+=`<path d="M${top.join('L')}L${bot.join('L')}Z" fill="url(#bb-cyl)" stroke="var(--line)"/><path d="M${top.join('L')}L${bot.join('L')}Z" fill="url(#bb-shade)"/>`;
b+=`<path d="M${arc(504,1136,YT+7).join('L')}" fill="none" stroke="var(--body)" stroke-width="3" opacity=".9"/>`;
b+=`<path d="M${arc(500,1140,356).join('L')}" fill="none" stroke="var(--line)" opacity=".8"/><path d="M${arc(500,1140,468).join('L')}" fill="none" stroke="var(--line)" opacity=".6"/>`;
b+=`<path d="M532 356V468M884 356V468" stroke="var(--line)" opacity=".5"/>`;let bt=arc(532,884,356),bb_=arc(532,884,468).reverse();b+=`<path d="M${bt.join('L')}L${bb_.join('L')}Z" fill="var(--faint)" opacity=".45"/>`;for(let k=0;k<4;k++){let x=1036+k*14;b+=`<path d="M${x} ${F(nearY(x,392,ryAt(392)))}V${F(nearY(x,428,ryAt(428)))}" stroke="var(--line)" stroke-width="3" stroke-linecap="round" opacity=".55"/>`}b+=`<path d="M${arc(560,880,474).join('L')}" fill="none" stroke="var(--body)" stroke-width="2" opacity=".7"/>`;
let wt=arc(572,740,380),wb=arc(572,740,414).reverse();b+=`<path d="M${wt.join('L')}L${wb.join('L')}Z" fill="url(#bb-win)"/><path d="M600 ${F(nearY(600,412,ryAt(412)))}L640 ${F(nearY(640,382,ryAt(382)))}H656L616 ${F(nearY(616,412,ryAt(412)))}Z" fill="var(--body)" opacity=".12"/><path d="M${arc(580,732,385).join('L')}" fill="none" stroke="var(--body)" opacity=".25"/>`;
b+=`<circle cx="622" cy="${F(nearY(622,397,ryAt(397)))}" r="5" fill="var(--green)" opacity=".55"/><circle cx="690" cy="${F(nearY(690,397,ryAt(397)))}" r="5" fill="var(--green)" opacity=".55"/>`;
b+=`<path id="bb-led" d="M${arc(600,712,338).join('L')}" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round"/>`;
b+=`<text x="912" y="${F(nearY(950,445,ryAt(445))+4)}" font-size="13" letter-spacing="5" style="fill:var(--line)">YUJIAN</text><text x="994" y="${F(nearY(1030,445,ryAt(445))+4)}" font-size="11" letter-spacing="2" style="fill:var(--green)">Y1</text>`;
q('#bb-body').innerHTML=b})();
/* 吸入流线：从画面下缘与前方地面汇向吸口 */
const N=16,lines=[];for(let i=0;i<N;i++){let f=i/(N-1),sx=i<3?380+i*40:470+(f)*600,sy=i<3?548+i*8:600,ex=752+f*118,ey=508,c1x=sx+(ex-sx)*.18,c1y=sy-(i<3?4:22),c2x=ex+(sx-ex)*.5,c2y=ey+20;lines.push([sx,sy,c1x,c1y,c2x,c2y,ex,ey])}
const bz=(L,u)=>{let m=1-u;return{x:m*m*m*L[0]+3*m*m*u*L[2]+3*m*u*u*L[4]+u*u*u*L[6],y:m*m*m*L[1]+3*m*m*u*L[3]+3*m*u*u*L[5]+u*u*u*L[7]}};
/* 吸力强度：与两组时间轴同步（上毯加力、墙角、集尘时增强） */
function power(v){let k=.42;if(v>=4&&v<9.6)k=.42+.58*clamp((v-4)/.6)*(1-clamp((v-9)/.6));if(v>=21&&v<25.5)k=Math.max(k,.42+.48*clamp((v-21)/.6)*(1-clamp((v-24.8)/.7)));if(v>=40&&v<42.4)k=Math.max(k,.42+.4*clamp((v-40)/.4)*(1-clamp((v-42)/.4)));return k}
const chapters=[[6,'01','ADAPT','越过日常','地毯抬布 · 识线绕行'],[23,'02','REACH','抵达角落','贴墙沿边 · 边刷伸角'],[41,'03','RETURN','洁净如初','自动回站 · 集尘洗烘']];
function render(){const k=still?.75:power(t),cur=still?-1:(t<16.5?0:t<31?1:2);
/* 流线与颗粒 */
let g='';lines.forEach((L,i)=>{const off=still?0:-(t*60+i*13);g+=`<path d="M${L[0]} ${L[1]}C${F(L[2])} ${F(L[3])} ${F(L[4])} ${F(L[5])} ${F(L[6])} ${L[7]}" fill="none" stroke="var(--green)" stroke-width="${F(.8+k*.9)}" stroke-dasharray="36 20" stroke-dashoffset="${F(off)}" stroke-linecap="round" opacity="${F(.18+k*.5)}"/>`;
for(let j=0;j<2;j++){let u=still?((i*.37+j*.5)%1):((t*(.18+k*.32)+i*.37+j*.5)%1),p=bz(L,u),sz=(1-u)*2.6+.7;g+=i%3==0?`<rect x="${F(p.x-sz)}" y="${F(p.y-sz*.6)}" width="${F(sz*2)}" height="${F(sz*1.2)}" rx=".6" transform="rotate(${F((t*90+i*40)%360)} ${F(p.x)} ${F(p.y)})" fill="var(--ink)" opacity="${F((.35+k*.4)*(1-u*.4))}"/>`:`<circle cx="${F(p.x)}" cy="${F(p.y)}" r="${F(sz)}" fill="${j?'var(--ink)':'var(--green)'}" opacity="${F((.3+k*.45)*(1-u*.4))}"/>`}});
q('#bb-flow').innerHTML=g;
/* 滚刷转动 */
let r='',ph=still?0:(t*(30+40*k))%14;for(let x=746+ph;x<876;x+=14)r+=`<path d="M${F(x)} 504L${F(x+7)} 511" stroke="var(--green)" stroke-width="1.6" opacity=".8"/>`;q('#bb-roller').innerHTML=r;
/* 前侧边刷（近乎侧视的压扁转子） */
let br=`<ellipse cx="596" cy="514" rx="66" ry="9" fill="none" stroke="var(--green)" stroke-dasharray="2 4" opacity=".35"/>`,ba=still?.3:t*5;for(let a=0;a<3;a++){let an=ba+a*2.094;br+=`<line x1="596" y1="514" x2="${F(596+Math.cos(an)*66)}" y2="${F(514+Math.sin(an)*9)}" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>`}br+=`<circle cx="596" cy="514" r="6" fill="var(--soft)" stroke="var(--line)"/>`;q('#bb-front').innerHTML=br;
/* 指示灯呼吸 */
const pulse=still?1:.55+.45*Math.sin(t*2.4)**2;q('#bb-led').style.opacity=F(.45+.55*pulse*k);q('#bb-tled').style.opacity=F(.5+.5*pulse);
/* 目录：对应下方两组的三个章节 */
let c='';chapters.forEach(([tt,n,en,cn,sub],i)=>{const y=196+i*30,on=cur===i,op=still||on?1:.42;c+=`<g class="toc" data-t="${tt}" tabindex="0" role="button" aria-label="跳到 ${n} ${cn}" opacity="${op}"><rect x="58" y="${y-17}" width="282" height="26" rx="5" fill="${on?'var(--faint)':'transparent'}" stroke="none"/><path d="M64 ${y+9}H336" stroke="var(--line)" opacity=".45"/><text x="68" y="${y}" font-size="10" letter-spacing="2" class="minor">${n}</text><text x="92" y="${y}" font-size="10" letter-spacing="2.5">${en}</text><text x="158" y="${y}" font-size="13" font-weight="500">${cn}</text><text x="220" y="${y}" font-size="10" class="minor">${sub}</text>${on?`<circle cx="330" cy="${y-4}" r="3" fill="var(--green)"/>`:''}</g>`});q('#bb-toc').innerHTML=c;
q('#bb-time').value=t;q('#bb-play').textContent=playing?'暂停':'播放';q('#bb-still').setAttribute('aria-pressed',still);let s=still?'定格 · 隅见 Y1':['吸力随地面调整 · 01 越过日常','吸力随地面调整 · 02 抵达角落','吸力随地面调整 · 03 洁净如初'][cur]+(k>.7?' · 增强':'');if(q('#bb-status').textContent!==s)q('#bb-status').textContent=s}
/* 目录点击：单独使用时自己跳转；在长页面中由外层统一驱动 */
function jump(v){root.dispatchEvent(new CustomEvent('bb-jump',{detail:v,bubbles:true}));if(!root.closest('[data-synced]')){t=v;still=false;playing=false;render()}}
q('#bb-toc').addEventListener('click',e=>{const g=e.target.closest('.toc');if(g)jump(+g.dataset.t)});q('#bb-toc').addEventListener('keydown',e=>{const g=e.target.closest('.toc');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();jump(+g.dataset.t)}});
q('#bb-play').onclick=()=>{still=false;if(t>=44)t=0;playing=!playing;last=performance.now();render()};q('#bb-still').onclick=()=>{still=true;playing=false;render()};q('#bb-restart').onclick=()=>{t=0;still=false;playing=true;last=performance.now();render()};q('#bb-time').oninput=e=>{t=+e.target.value;still=false;playing=false;render()};document.addEventListener('visibilitychange',()=>{last=performance.now()});
/* 定格时流线也保持缓慢流动，让品牌图不显得静止 */
function tick(now){if(playing){t=Math.min(44,t+Math.min(.1,(now-last)/1000));if(t>=44)playing=false;render()}last=now;requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
})();
</script>
</div>

<div class="seam"></div>

<div id="robot-triptych">
<style>
#robot-triptych{--paper:light-dark(#f4f2eb,#222824);--ink:light-dark(#253c35,#e1e9df);--soft:light-dark(#dadfd4,#3c4940);--faint:light-dark(#e8e9e0,#303a33);--green:light-dark(#527664,#a5c9a8);--body:light-dark(#fffefa,#dce2da);--line:light-dark(#a3b1a2,#687c6d);font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}

<script>
(()=>{const root=document.getElementById('robot-triptych'),q=s=>root.querySelector(s),ns='http://www.w3.org/2000/svg',art=q('#rt-art');let t=0,playing=false,still=true,last=0;
const clamp=v=>Math.max(0,Math.min(1,v)),sm=f=>f*f*(3-2*f),F=n=>+n.toFixed(2),R=28;
/* 与技术组同一时间轴：相同时刻发生相同事件 */
const points=[[0,60,600],[2,100,600],[4,100,600],[7,225,600],[8,262,600],[9,270,520],[10.6,268,462],[11.6,268,462],[12.8,205,410],[14,215,330],[16,330,252],[17,420,242],[21,648,242],[25,648,242],[31,648,500],[35,800,590],[37,850,600],[38,850,600],[40,958,600],[44,958,600]];
function pos(v){v=Math.max(0,Math.min(44,v));let i=points.findIndex(p=>p[0]>=v);if(i<=0)return{x:points[0][1],y:points[0][2]};let a=points[i-1],b=points[i],f=sm((v-a[0])/(b[0]-a[0]));return{x:a[1]+(b[1]-a[1])*f,y:a[2]+(b[2]-a[2])*f};}
const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
function head(v){let a=pos(v-.08),b=pos(v+.08);if(Math.hypot(b.x-a.x,b.y-a.y)>.3)return ang(a,b);const back=(v>=10.6&&v<=11.6)||(v>=21&&v<=25)||v>=43;if(!back)for(let d=.2;d<5;d+=.2){let c=pos(v+d);if(Math.hypot(c.x-a.x,c.y-a.y)>1)return ang(a,c)}for(let d=.2;d<8;d+=.2){let c=pos(v-d);if(Math.hypot(c.x-a.x,c.y-a.y)>1)return ang(c,a)}return 0}
const mopLift=v=>v>=2&&v<9.9?clamp((v-2)/1.5)*(1-clamp((v-9)/.9)):0;
const brushOut=v=>v>=21&&v<26?clamp((v-21)/1.2)*(1-clamp((v-24)/1)):0;
/* 静态地面网格 */
(function(){let g='';for(let x=60;x<1080;x+=60)g+=`<line x1="${x}" x2="${x}" y1="150" y2="660" stroke="var(--soft)" opacity=".55"/>`;for(let y=180;y<=660;y+=60)g+=`<line x1="0" x2="1080" y1="${y}" y2="${y}" stroke="var(--soft)" opacity=".55"/>`;q('#rt-floor').innerHTML=g})();
/* 机器人（俯视，外观与技术组一致：中置激光塔、前窗、绿色指示灯、左前边刷、后置拖布） */
function robot(v){let p=pos(v),a=head(v),ml=mopLift(v),br=brushOut(v),spin=v*16;
let o=`<g transform="translate(${F(p.x)} ${F(p.y)})"><g transform="rotate(${F(a)})">`;
o+=`<path d="M${-R*.55} ${-R*.78}A${R*.95} ${R*.95} 0 0 0 ${-R*.55} ${R*.78}" fill="none" stroke="var(--green)" stroke-width="${F(5*(1-ml))}" stroke-linecap="round" opacity="${F(.5*(1-ml))}"/>`;
let bx=R*.62,by=-R*.62,ex=br*17,tx=bx+ex*.71,ty=by-ex*.71;
o+=`<path d="M${F(bx*.7)} ${F(by*.7)}L${F(tx)} ${F(ty)}" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/><g transform="translate(${F(tx)} ${F(ty)}) rotate(${F(spin*12)})" stroke="var(--green)" stroke-width="1.6" opacity="${br>.01?1:.55}"><path d="M-7 0H7M0 -7V7M-5 -5L5 5M-5 5L5 -5"/></g>`;
o+=`<circle r="${R}" fill="url(#rt-shell)" stroke="var(--line)" filter="url(#rt-shadow)"/><path d="M${F(R*.5)} ${F(-R*.866)}A${R} ${R} 0 0 1 ${F(R*.5)} ${F(R*.866)}" fill="none" stroke="var(--soft)" stroke-width="3"/><circle r="${R-4}" fill="none" stroke="var(--soft)"/>`;
o+=`<rect x="${R-7}" y="-7" width="4" height="14" rx="2" fill="var(--ink)" opacity=".72"/>`;
o+=`<circle r="9.5" fill="var(--soft)" stroke="var(--line)"/><circle r="5" fill="var(--body)"/><circle cx="6.5" r="1.8" fill="var(--green)"/>`;
o+=`<path d="M${-R*.42} ${R*.5}Q${-R*.62} 0 ${-R*.42} ${-R*.5}" fill="none" stroke="var(--line)" opacity=".7"/></g>`;
if(ml>.05)o+=`<g opacity="${F(ml)}"><circle r="${R+6}" fill="none" stroke="var(--green)" stroke-dasharray="3 4"/></g>`;
return o+'</g>'}
const mk=(n,x,y,op)=>op<=0?'':`<g opacity="${F(op)}"><circle cx="${F(x)}" cy="${F(y)}" r="7" fill="var(--green)" stroke="var(--paper)" stroke-width="1.5"/><text x="${F(x)}" y="${F(y+3.5)}" text-anchor="middle" font-size="9.5" style="fill:var(--paper)">${n}</text></g>`;
const lab=(n,x,y,title,val,op)=>op<=0?'':`<g opacity="${F(op)}"><circle cx="${x+7}" cy="${y-4}" r="7.5" fill="var(--green)"/><text x="${x+7}" y="${y-0.5}" text-anchor="middle" font-size="10" style="fill:var(--paper)">${n}</text><text x="${x+20}" y="${y}" class="lab">${title}</text><text x="${x+20}" y="${y+15}" class="val">${val}</text></g>`;
const ap=a=>still?1:clamp((t-a)/.6),win=(a,b,fi=.5,fo=.6)=>clamp((t-a)/fi)*(1-clamp((t-b)/fo));
function render(){let back='',front='',L='';
/* 已清扫轨迹 */
if(!still){let pts=[];for(let v=Math.max(0,t-3);v<=t;v+=.1){let p=pos(v);pts.push(F(p.x)+' '+F(p.y))}if(pts.length>1)back+=`<path d="M${pts.join('L')}" fill="none" stroke="var(--green)" stroke-width="${R*2}" stroke-linecap="round" stroke-linejoin="round" opacity=".09"/>`}
/* ① 地毯识别：毯边高亮 */
let ce=still?.8:win(1.2,4.6,.4,.6);if(ce>0)back+=`<path d="M128 552V648" stroke="var(--green)" stroke-width="3" stroke-linecap="round" opacity="${F(ce)}"/>`;
/* ③ 数据线：识别框 + 安全距离 + 绕行虚线 */
let bx=still?1:clamp((t-10.6)/.4)*(t<17?1:.6);if(bx>0)back+=`<ellipse cx="278" cy="400" rx="46" ry="26" fill="none" stroke="var(--green)" stroke-dasharray="2 4" opacity="${F(bx*.8)}"/><g fill="none" stroke="var(--ink)" stroke-width="1.2" opacity="${F(bx)}"><path d="M236 386V380H244M316 380H324V386M324 412V418H316M244 418H236V412"/></g><text x="280" y="372" text-anchor="middle" class="tiny" opacity="${F(bx)}">数据线</text>`;
let dp=still?1:win(11,17.5,.6,.8);if(dp>0){let pts=[];for(let v=11.6;v<=17;v+=.2){let p=pos(v);pts.push(F(p.x)+' '+F(p.y))}back+=`<path d="M${pts.join('L')}" fill="none" stroke="var(--green)" stroke-width="1.6" stroke-dasharray="5 4" opacity="${F(dp*.8)}"/>`}
let sc=still?0:win(9.9,11.9,.4,.4);if(sc>0){let p=pos(t);back+=`<path d="M${F(p.x)} ${F(p.y-R)}L238 404L320 404Z" fill="var(--green)" opacity="${F(.13*sc)}"/>`}
q('#rt-cable').style.strokeWidth=(!still&&t>=10.6&&t<11.6)?'4.4':'3';
/* ④ 贴墙 */
let tof=still?.7:win(17,21.2,.5,.6),pw=pos(still?23:t);if(tof>0&&pw.x>380&&pw.x<700&&pw.y<300){for(let k=0;k<3;k++)front+=`<path d="M${F(pw.x-14+k*9)} ${F(pw.y-R-1)}V215" stroke="var(--green)" stroke-width="1.2" stroke-dasharray="1.5 2" opacity="${F(tof)}"/>`}
/* ⑤ 识别墙角 */
let lz=still?.8:win(19.5,22,.4,.5);if(lz>0)front+=`<path d="M676 216V246" stroke="var(--green)" stroke-width="3" stroke-linecap="round" opacity="${F(lz)}"/><path d="M664 214H676V226" fill="none" stroke="var(--ink)" stroke-width="1.4" opacity="${F(lz)}"/>`;
/* ⑥ 圆形盲区：边刷清扫后消失 */
let cl=still?.5:clamp((t-22.2)/1.8),zo=still?1:(t<19?0:t<26?1:1-clamp((t-26)/1));q('#rt-zone-g').innerHTML=zo>0?`<path d="M648 214L676 214L676 242A28 28 0 0 0 648 214Z" fill="url(#rt-zone)" opacity="${F(zo*(.85*(1-cl)+.1))}"/>`:'';
q('#rt-dust').style.opacity=still?'.6':.9*(1-clamp((t-22.2)/1.8));
/* ⑦ 对准回站 */
let ir=still?0:win(34,38.6,.6,.6);if(ir>0){for(let k=0;k<3;k++){let ph=still?k/3:((t*1.2+k/3)%1),r=14+ph*70;back+=`<path d="M${F(912-r*.5)} ${F(600-r*.85)}A${F(r)} ${F(r)} 0 0 0 ${F(912-r*.5)} ${F(600+r*.85)}" fill="none" stroke="var(--green)" stroke-width="1.3" opacity="${F(ir*(1-ph))}"/>`}back+=`<path d="M912 600H${still?850:F(Math.min(912,pos(t).x+R))}" stroke="var(--green)" stroke-dasharray="1 4" opacity="${F(ir)}"/>`}
/* ⑧ 集尘 ⑨ 洗拖布 */
let fl=still?1:win(40,42.2,.3,.5);if(fl>0)for(let k=0;k<4;k++){let ph=still?k/4:((t*1.1+k/4)%1);front+=`<circle cx="${F(966+ph*52)}" cy="${F(606+Math.sin(ph*6)*3)}" r="1.8" fill="var(--ink)" opacity="${F(fl*.7*(1-ph*.6))}"/>`}
let wb=still?1:win(42,44.5,.3,.3);if(wb>0)for(let k=0;k<3;k++){let ph=still?k/3:((t*1.2+k/3)%1);front+=`<circle cx="928" cy="600" r="${F(8+ph*18)}" fill="none" stroke="var(--green)" opacity="${F(wb*(1-ph)*.8)}"/>`}
let ch=still?1:clamp((t-39.6)/.4);q('#rt-led').setAttribute('r',F(3+(still?0:ch*.8*Math.sin(t*4))));q('#rt-led').style.opacity=still?1:.3+.7*ch;
let bat=still?1:clamp((t-40)/.4);if(bat>0){let pct=still?68:Math.round(23+clamp((t-40)/4)*45);front+=`<g opacity="${F(bat)}"><rect x="990" y="518" width="34" height="13" rx="3" fill="none" stroke="var(--green)" stroke-width="1.2"/><rect x="1024" y="522" width="3" height="5" fill="var(--green)"/><rect x="992.5" y="520.5" width="${F(29*pct/100)}" height="8" rx="1.5" fill="var(--green)"/><text x="1032" y="529" class="tiny minor">${pct}%</text></g>`}
/* 闪光 */
q('#rt-sparkles').querySelectorAll('g').forEach((g,i)=>{const f=clamp((t-31-i*1.4)/2.5),pulse=Math.sin(Math.PI*f),path=g.querySelector('path');g.style.opacity=still?.75:clamp((t-31-i*1.4)/.6)*(.55+.4*pulse);path.setAttribute('transform',`scale(${still?1:.75+.4*pulse})`)});
q('#rt-dynback').innerHTML=back;q('#rt-dynfront').innerHTML=front;
q('#rt-robots').innerHTML=(still?[6,23,41]:[t]).map(robot).join('');
/* 标注：编号与技术组一一对应 */
L+=lab('1',28,262,'识别地毯','毯边前停一下，再上毯',ap(1.2));
L+=lab('2',28,310,'拖布自动抬起','地毯不被打湿',ap(3));
L+=lab('3',28,358,'识别数据线','绕开走，不缠不拖',ap(10.4));
L+=lab('4',412,526,'贴墙沿边','紧贴墙根，一路扫过',ap(17.4));
L+=lab('5',412,574,'识别直角','到角先减速',ap(19.8));
L+=lab('6',412,622,'边刷伸入墙角','圆形机身够不到的角也扫到',ap(21.2));
L+=lab('7',748,262,'自动对准回站','无需人工摆放',ap(34.4));
L+=lab('8',748,310,'自动集尘','尘盒倒空，不碰灰尘',ap(40.2));
L+=lab('9',748,358,'洗拖布 · 烘干 · 充电','准备好下一次',ap(42.2));
L+=mk('1',116,566,ap(1.2))+mk('3',236,374,ap(10.4))+mk('5',688,256,ap(19.8))+mk('7',904,646,ap(34.4))+mk('8',1066,640,ap(40.2))+mk('9',914,560,ap(42.2));
let p1=pos(still?6:t);if(still||mopLift(t)>.3)L+=mk('2',p1.x-R-12,p1.y+R+2,still?1:clamp((mopLift(t)-.3)/.3)*ap(3));
